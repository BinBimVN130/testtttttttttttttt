<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Web App v1.0.6</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* Đã loại bỏ hoàn toàn các thuộc tính backdrop-filter / blur gây lag */
    }

    /* Thanh trạng thái FPS & Version */
    .status-bar {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 11px;
      color: #a0a0a0;
      z-index: 10;
      font-family: monospace;
    }

    /* Container chính */
    .app-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d0d0d;
    }

    /* Khung hình Video - Đã thu nhỏ gọn gàng như bản cũ */
    .video-wrapper {
      position: relative;
      max-width: 82vw;
      max-height: 82vh;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Giữ nguyên tỉ lệ hình ảnh, không bị tràn hay biến dạng */
    }

    /* Thanh công cụ bên trái */
    .left-bar {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      z-index: 5;
      background: rgba(25, 25, 25, 0.85);
      padding: 12px 8px;
      border-radius: 20px;
    }

    /* Thanh công cụ bên phải */
    .right-bar {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      z-index: 5;
      background: rgba(25, 25, 25, 0.85);
      padding: 12px 8px;
      border-radius: 20px;
    }

    /* Các nút bấm icon */
    .btn-icon {
      background: transparent;
      border: none;
      color: #e0e0e0;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.15s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Nút quay phim / chụp ảnh chính */
    .btn-record {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #ff4d4d;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-record-inner {
      width: 34px;
      height: 34px;
      background: #ff4d4d;
      border-radius: 50%;
    }

    /* Nút vàng chuyển đổi chế độ */
    .btn-yellow {
      background: #ffaa00;
      color: #000;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
    }

    /* Thanh Zoom thu phóng */
    .zoom-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: rgba(40, 40, 40, 0.5);
      padding: 8px 4px;
      border-radius: 16px;
    }

    .zoom-slider {
      writing-mode: bt-lr;
      appearance: slider-vertical;
      width: 8px;
      height: 70px;
    }

    /* Thanh hiển thị Micro góc dưới trái */
    .mic-indicator {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(25, 25, 25, 0.85);
      padding: 6px 10px;
      border-radius: 12px;
    }

    .mic-bar-bg {
      width: 50px;
      height: 4px;
      background: #444;
      border-radius: 2px;
      overflow: hidden;
    }

    .mic-bar-fill {
      width: 45%;
      height: 100%;
      background: #4caf50;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- FPS & Phiên bản -->
    <div class="status-bar" id="fpsDisplay">FPS: -- | v1.0.6 (Tối ưu)</div>

    <!-- Thanh công cụ trái -->
    <div class="left-bar">
      <button class="btn-icon" title="Yêu thích">♥</button>
      <button class="btn-icon" title="Chế độ">●</button>
      <button class="btn-icon" title="Đèn Flash">⚡</button>
      <button class="btn-icon" title="Hẹn giờ">⏱</button>
      <button class="btn-icon" title="Tỉ lệ khung hình">16:9</button>
      <button class="btn-icon" title="Độ sáng">☀</button>
      <button class="btn-icon" title="Hiệu ứng">⭕</button>
      <button class="btn-icon" title="Bộ lọc">🌡</button>
    </div>

    <!-- Khung hình Camera chính (Thu nhỏ gọn gàng) -->
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <!-- Thanh công cụ phải -->
    <div class="right-bar">
      <button class="btn-icon" title="Chụp ảnh">📷</button>
      <button class="btn-yellow" title="Quay phim">📹</button>
      <button class="btn-icon" title="Lưới căn chỉnh">⊞</button>
      
      <!-- Thanh Zoom -->
      <div class="zoom-container">
        <span style="font-size: 10px;">🔍</span>
        <input type="range" class="zoom-slider" min="1" max="3" step="0.1" value="1" id="zoomRange">
      </div>

      <!-- Nút Ghi hình -->
      <button class="btn-record">
        <div class="btn-record-inner"></div>
      </button>

      <button class="btn-yellow" title="Đổi giao diện">↔</button>
      <button class="btn-icon" title="Lật camera">⇆</button>
    </div>

    <!-- Tín hiệu Micro -->
    <div class="mic-indicator">
      <span style="font-size: 12px;">🎙</span>
      <div class="mic-bar-bg">
        <div class="mic-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const fpsDisplay = document.getElementById('fpsDisplay');

    // Khởi tạo luồng Camera nhẹ, không dùng canvas trung gian
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Không thể kết nối camera:", err);
      }
    }

    // Bộ đếm FPS tối ưu phần cứng
    let lastTime = performance.now();
    let frameCount = 0;

    function monitorFPS() {
      const now = performance.now();
      frameCount++;
      if (now - lastTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        fpsDisplay.textContent = `FPS: ${fps} | v1.0.6 (Tối ưu)`;
        frameCount = 0;
        lastTime = now;
      }
      requestAnimationFrame(monitorFPS);
    }

    initCamera();
    requestAnimationFrame(monitorFPS);
  </script>
</body>
</html>
